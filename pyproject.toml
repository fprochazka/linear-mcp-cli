[project]
name = "linear-mcp-cli"
version = "0.1.0"
description = "CLI wrapper for Linear MCP Server"
authors = [
    {name = "Filip Prochazka"}
]
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.25.0,<2.0.0",
    "click>=8.3.1,<9.0.0",
    "httpx>=0.28.1,<0.29.0",
    "pyyaml>=6.0.3,<7.0.0",
    "rich>=14.2.0,<15.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
]

[project.scripts]
linear-mcp = "linear_mcp.cli:main"

[tool.poetry]
packages = [{include = "linear_mcp", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = []

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = [
    "ruff>=0.14.10,<0.15.0",
]
